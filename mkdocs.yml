# ---------------------------------------------------------------------------
# Site settings, read by Zensical (and by MkDocs + Material, which still works).
# The site lives at https://traderlarry.com (custom domain via GitHub Pages).
# ---------------------------------------------------------------------------
site_name: Larry's Project Sandbox
site_description: Articles, guides and progress notes for my open-source Python apps.
site_author: Larry
site_url: https://traderlarry.com/
repo_url: https://github.com/trader-larry  # links the GitHub icon in the header to your profile
repo_name: trader-larry
copyright: Copyright &copy; 2026 Larry

theme:
  name: material
  language: en
  icon:
    logo: material/notebook-edit-outline
    repo: fontawesome/brands/github
  palette:
    # Auto / light / dark toggle, like your dashboard.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs          # top-level tabs: Home / Personal Projects / Blog / About
    # (navigation.sections is off so each project folds open and closed in the sidebar)
    - navigation.indexes       # a folder's index.md becomes its landing page
    - navigation.top           # "back to top" button
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy        # copy button on code blocks
    - toc.follow

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_excerpt_separator: "((more))"   # type ((more)) on its own line to cut the post off on the blog page
      post_url_format: "{date}/{slug}"
      archive_name: Archive
      categories_name: Categories
  - tags

markdown_extensions:
  - admonition               # !!! note / tip / warning boxes
  - attr_list                # { width="600" } on images, buttons
  - md_in_html
  - pymdownx.details         # collapsible ??? blocks (used for the FAQ)
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tilde          # ~~strikethrough~~ from the Pages CMS editor
  - mdx_truly_sane_lists:    # sub-bullets indented by 2 spaces (Pages CMS writes them that way)
      truly_sane: false      # (so grid-card content is indented 2 spaces too, see docs/index.md)
  - pymdownx.keys            # ++ctrl+c++ keyboard keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/read-more.js   # hides the ((more)) line on full posts

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/trader-larry

nav:
  - Home: index.md
  - Personal Projects:
      - projects/index.md
      - Dividend Dashboard:
          - projects/dividend-dashboard/index.md
          - Getting started: projects/dividend-dashboard/getting-started.md
          - Features: projects/dividend-dashboard/features.md
          - Screenshots: projects/dividend-dashboard/screenshots.md
          - FAQ: projects/dividend-dashboard/faq.md
      - Desktop Charts:
          - projects/desktop-charts/index.md
          - Getting started: projects/desktop-charts/getting-started.md
          - Features: projects/desktop-charts/features.md
          - Screenshots: projects/desktop-charts/screenshots.md
          - FAQ: projects/desktop-charts/faq.md
      - Market Theme Map:
          - projects/market-theme-map/index.md
          - Getting started: projects/market-theme-map/getting-started.md
          - Features: projects/market-theme-map/features.md
          - Screenshots: projects/market-theme-map/screenshots.md
          - FAQ: projects/market-theme-map/faq.md
  - Blog:
      - blog/index.md
  - About: about.md
